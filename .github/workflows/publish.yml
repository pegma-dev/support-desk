# Normal publication is release-event-only from a protected signed stable tag.
# Recovery reruns failed jobs on the unchanged tag, retaining the original
# preparation outputs/artifact; never rerun all jobs or repack a partial release.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  identity:
    name: Verify signed release identity
    if: >-
      github.repository == 'pegma-dev/support-desk' &&
      github.event_name == 'release' &&
      !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      GIT_NO_REPLACE_OBJECTS: "1"
    steps:
      # No project code or dependency installation precedes signer validation.
      - name: Validate the stable release event
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ||
                ! "${RELEASE_COMMIT}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ||
                "${GITHUB_REF}" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "::error::An exact stable release tag and full source commit are required"
            exit 1
          fi
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch the protected release branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Verify the approved signer, source and main ancestry
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain reviewed SSH allowed-signers entries"
            exit 1
          fi
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"
          tag_ref="refs/tags/${RELEASE_TAG}"
          if [[ "$(git cat-file -t "${tag_ref}")" != "tag" ||
                "$(git rev-parse HEAD)" != "${RELEASE_COMMIT}" ||
                "$(git rev-parse "${tag_ref}^{commit}")" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::The annotated tag target, checkout and release commit must match"
            exit 1
          fi
          git verify-tag --raw "${tag_ref}"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" refs/remotes/origin/main
          printf 'tag=%s\ncommit=%s\n' "${RELEASE_TAG}" "${RELEASE_COMMIT}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Release gate / Node.js ${{ matrix.node-version }}
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Check types
        run: pnpm run check
      - name: Run all tests
        run: pnpm test
      - name: Run synthetic composition
        run: pnpm example
      - name: Run optional AI composition
        run: pnpm run ai:example
      - name: Check release metadata
        run: pnpm run release:check
      - name: Pack and import all public artifacts
        run: pnpm run release:pack -- --output .release/ci-check
      - name: Validate and independently hash the Node consumer evidence
        id: consumer
        env:
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { resolve, join } from "node:path";
          import { RELEASE_PACKAGES } from "./scripts/release-packages.mjs";
          import { verifyConsumerReceipt } from "./scripts/release-consumers.mjs";
          const directory = resolve(".release/ci-check");
          const manifestBytes = await readFile(join(directory, "package-manifest.json"));
          const manifest = JSON.parse(manifestBytes);
          const receiptBytes = await readFile(`${directory}-consumer-verification.json`);
          if (manifest.gitCommit !== process.env.RELEASE_COMMIT) throw new Error("Consumer manifest source mismatch");
          await verifyConsumerReceipt(JSON.parse(receiptBytes), {
            sourceCommit: process.env.RELEASE_COMMIT,
            records: manifest.packages.map(record => ({ ...record, tarballPath: join(directory, record.tarball) })),
            inventory: RELEASE_PACKAGES,
          });
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
          await appendFile(process.env.GITHUB_OUTPUT, `receipt-sha256=${digest(receiptBytes)}\nmanifest-sha256=${digest(manifestBytes)}\n`);
          NODE
      - name: Retain the Node consumer evidence separately
        id: consumer-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-desk-validation-consumer-node${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/ci-check-consumer-verification.json
            .release/ci-check/package-manifest.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Record the Node consumer evidence identity
        env:
          SOURCE_TAG: ${{ needs.identity.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.identity.outputs.commit }}
          NODE_LANE: ${{ matrix.node-version }}
          MANIFEST_SHA256: ${{ steps.consumer.outputs.manifest-sha256 }}
          RECEIPT_SHA256: ${{ steps.consumer.outputs.receipt-sha256 }}
          CONSUMER_ARTIFACT_ID: ${{ steps.consumer-upload.outputs.artifact-id }}
          CONSUMER_ARTIFACT_DIGEST: ${{ steps.consumer-upload.outputs.artifact-digest }}
        run: |
          printf 'Validation Node lane: %s\n\nSource tag: %s\n\nSource commit: %s\n\nIndependent manifest SHA-256: %s\n\nIndependent consumer receipt SHA-256: %s\n\nConsumer evidence artifact ID: %s\n\nConsumer evidence archive SHA-256: %s\n' \
            "${NODE_LANE}" "${SOURCE_TAG}" "${SOURCE_COMMIT}" "${MANIFEST_SHA256}" "${RECEIPT_SHA256}" "${CONSUMER_ARTIFACT_ID}" "${CONSUMER_ARTIFACT_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

  prepare:
    name: Prepare immutable signed-tag artifacts
    needs: [identity, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
      consumer-receipt-sha256: ${{ steps.consumer.outputs.sha256 }}
      consumer-artifact-id: ${{ steps.consumer-upload.outputs.artifact-id }}
      consumer-artifact-digest: ${{ steps.consumer-upload.outputs.artifact-digest }}
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      GIT_NO_REPLACE_OBJECTS: "1"
    steps:
      - name: Check out the verified source and tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.identity.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch the protected release branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Configure the approved signer
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_ALLOWED_SIGNERS}"
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Use the reviewed packer npm
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run optional AI composition
        run: pnpm run ai:example
      - name: Prepare the exact release once
        run: >-
          pnpm run release:pack -- --require-clean --require-main-ancestor
          --require-release-tag --expected-release-commit "${RELEASE_COMMIT}"
          --output "${RUNNER_TEMP}/support-desk-prepared"
      # This trusted output is independent of the uploaded manifest itself.
      - name: Independently pin and validate the prepared manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          read -r manifest_sha256 _ < <(sha256sum "${RUNNER_TEMP}/support-desk-prepared/package-manifest.json")
          [[ "${manifest_sha256}" =~ ^[0-9a-f]{64}$ ]]
          RELEASE_MANIFEST_SHA256="${manifest_sha256}" node --input-type=module -e '
            import { verifyPreparedRelease } from "./scripts/release-verification.mjs";
            await verifyPreparedRelease({ manifest: `${process.env.RUNNER_TEMP}/support-desk-prepared/package-manifest.json`, manifestSha256: process.env.RELEASE_MANIFEST_SHA256, releaseTag: process.env.RELEASE_TAG, expectedReleaseCommit: process.env.RELEASE_COMMIT });
          '
          printf 'sha256=%s\n' "${manifest_sha256}" >> "${GITHUB_OUTPUT}"
      - name: Validate and independently hash the prepared consumer receipt
        id: consumer
        env:
          MANIFEST_SHA256: ${{ steps.manifest.outputs.sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          import { RELEASE_PACKAGES } from "./scripts/release-packages.mjs";
          import { verifyConsumerReceipt } from "./scripts/release-consumers.mjs";
          const directory = join(process.env.RUNNER_TEMP, "support-desk-prepared");
          const manifestBytes = await readFile(join(directory, "package-manifest.json"));
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
          if (digest(manifestBytes) !== process.env.MANIFEST_SHA256) throw new Error("Consumer manifest digest mismatch");
          const manifest = JSON.parse(manifestBytes);
          if (manifest.gitCommit !== process.env.RELEASE_COMMIT || manifest.releaseTag !== process.env.RELEASE_TAG) throw new Error("Consumer manifest source mismatch");
          const receiptBytes = await readFile(`${directory}-consumer-verification.json`);
          await verifyConsumerReceipt(JSON.parse(receiptBytes), {
            sourceCommit: process.env.RELEASE_COMMIT,
            records: manifest.packages.map(record => ({ ...record, tarballPath: join(directory, record.tarball) })),
            inventory: RELEASE_PACKAGES,
          });
          await appendFile(process.env.GITHUB_OUTPUT, `sha256=${digest(receiptBytes)}\n`);
          NODE
      - name: Upload the immutable original release
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-desk-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/support-desk-prepared/
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      # Retain detailed migration/AI proof without adding an unauthenticated
      # seventh file to the original strict release artifact.
      - name: Retain the prepared consumer receipt separately
        id: consumer-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-desk-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/support-desk-prepared-consumer-verification.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Record independent identity for approval and recovery
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          MANIFEST_SHA256: ${{ steps.manifest.outputs.sha256 }}
          RECEIPT_SHA256: ${{ steps.consumer.outputs.sha256 }}
          CONSUMER_ARTIFACT_ID: ${{ steps.consumer-upload.outputs.artifact-id }}
          CONSUMER_ARTIFACT_DIGEST: ${{ steps.consumer-upload.outputs.artifact-digest }}
        run: |
          printf 'Source tag: %s\n\nSource commit: %s\n\nPrepared artifact ID: %s\n\nArtifact SHA-256: %s\n\nIndependent manifest SHA-256: %s\n\nIndependent consumer receipt SHA-256: %s\n\nConsumer evidence artifact ID: %s\n\nConsumer evidence archive SHA-256: %s\n' \
            "${RELEASE_TAG}" "${RELEASE_COMMIT}" "${ARTIFACT_ID}" "${ARTIFACT_DIGEST}" "${MANIFEST_SHA256}" "${RECEIPT_SHA256}" "${CONSUMER_ARTIFACT_ID}" "${CONSUMER_ARTIFACT_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish exact prepared artifacts
    needs: [identity, prepare]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
      RELEASE_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
      RELEASE_ENVIRONMENT: npm-publish
      GIT_NO_REPLACE_OBJECTS: "1"
    steps:
      - name: Check out the exact verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js without package-manager configuration
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      # Extract only a checksum-pinned CLI; install/build/repack/import nothing
      # with OIDC authority and never run project/package lifecycle scripts.
      - name: Verify and extract the reviewed npm CLI
        shell: bash
        env:
          NPM_VERSION: 11.18.0
          NPM_TARBALL_SHA256: 73f6155215ebabf4ed96dca1f567c2372cc713c33af2e5b9b62fde4e92373e2e
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/npm-${NPM_VERSION}.tgz"
          npm_root="${RUNNER_TEMP}/release-npm-${NPM_VERSION}"
          curl --fail --silent --show-error --location --retry 3 \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" --output "${tarball}"
          echo "${NPM_TARBALL_SHA256}  ${tarball}" | sha256sum --check --strict --quiet
          mkdir "${npm_root}"
          tar --extract --gzip --file "${tarball}" --directory "${npm_root}"
          npm_cli="${npm_root}/package/bin/npm-cli.js"
          [[ "$(node "${npm_cli}" --version)" == "${NPM_VERSION}" ]]
          printf 'RELEASE_NPM_CLI=%s\nRELEASE_NPM_VERSION=%s\n' "${npm_cli}" "${NPM_VERSION}" >> "${GITHUB_ENV}"
      - name: Download the original immutable preparation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/support-desk-prepared
      - name: Preflight all five and publish original tarballs through OIDC
        run: >-
          node scripts/release-verification.mjs publish
          --manifest "${RUNNER_TEMP}/support-desk-prepared/package-manifest.json"
          --manifest-sha256 "${RELEASE_MANIFEST_SHA256}"
          --release-tag "${RELEASE_TAG}" --expected-release-commit "${RELEASE_COMMIT}"

  verify:
    name: Verify registry signatures, source provenance and consumer
    needs: [identity, prepare, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: none
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
      RELEASE_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
      GIT_NO_REPLACE_OBJECTS: "1"
    steps:
      - name: Check out the exact verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js without package-manager configuration
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Verify and extract the reviewed npm CLI
        shell: bash
        env:
          NPM_VERSION: 11.18.0
          NPM_TARBALL_SHA256: 73f6155215ebabf4ed96dca1f567c2372cc713c33af2e5b9b62fde4e92373e2e
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/npm-${NPM_VERSION}.tgz"
          npm_root="${RUNNER_TEMP}/release-npm-${NPM_VERSION}"
          curl --fail --silent --show-error --location --retry 3 \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" --output "${tarball}"
          echo "${NPM_TARBALL_SHA256}  ${tarball}" | sha256sum --check --strict --quiet
          mkdir "${npm_root}"
          tar --extract --gzip --file "${tarball}" --directory "${npm_root}"
          npm_cli="${npm_root}/package/bin/npm-cli.js"
          [[ "$(node "${npm_cli}" --version)" == "${NPM_VERSION}" ]]
          printf 'RELEASE_NPM_CLI=%s\nRELEASE_NPM_VERSION=%s\n' "${npm_cli}" "${NPM_VERSION}" >> "${GITHUB_ENV}"
      - name: Download the same original immutable preparation artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/support-desk-prepared
      # Upload status is insufficient. Authenticate before executing imports.
      - name: Verify registry bytes, provenance and clean public imports
        run: >-
          node scripts/release-verification.mjs verify
          --manifest "${RUNNER_TEMP}/support-desk-prepared/package-manifest.json"
          --manifest-sha256 "${RELEASE_MANIFEST_SHA256}"
          --release-tag "${RELEASE_TAG}" --expected-release-commit "${RELEASE_COMMIT}"
