name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Run synthetic composition
        run: pnpm example

      - name: Run optional AI composition
        run: pnpm run ai:example

      - name: Check release metadata
        run: pnpm run release:check

      - name: Pack and import public artifacts
        run: pnpm run release:pack -- --output .release/ci-check

      - name: Independently pin consumer evidence
        id: consumer-evidence
        run: |
          node --input-type=module -e '
            import {createHash} from "node:crypto";
            import {readFileSync,appendFileSync} from "node:fs";
            const digest=createHash("sha256").update(readFileSync(".release/ci-check-consumer-verification.json")).digest("hex");
            appendFileSync(process.env.GITHUB_OUTPUT,"sha256="+digest+"\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,"Development consumer receipt SHA-256: `"+digest+"`\n\nSource checkout: `"+process.env.GITHUB_SHA+"`\n");
          '

      - name: Retain development consumer evidence
        id: consumer-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-desk-consumer-node-${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/ci-check-consumer-verification.json
            .release/ci-check/package-manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Record retained consumer evidence identity
        env:
          RECEIPT_SHA256: ${{ steps.consumer-evidence.outputs.sha256 }}
          ARTIFACT_ID: ${{ steps.consumer-upload.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.consumer-upload.outputs.artifact-digest }}
        run: |
          printf 'Consumer receipt SHA-256: %s\n\nDiagnostic artifact ID: %s\n\nDiagnostic artifact SHA-256: %s\n' \
            "${RECEIPT_SHA256}" "${ARTIFACT_ID}" "${ARTIFACT_SHA256}" >> "${GITHUB_STEP_SUMMARY}"
